# Local development services (PostgreSQL, Mailpit). Start with `npm run db:up`, stop with
# `npm run db:down`.
name: forgeflow

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: forgeflow
      POSTGRES_PASSWORD: forgeflow
      POSTGRES_DB: forgeflow
    ports:
      # Override the host port with FORGEFLOW_DB_PORT if 5432 is already taken on your machine.
      - '${FORGEFLOW_DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the forgeflow_app login role on a new volume (see postgres/init/01-app-role.sql).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forgeflow -d forgeflow']
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email the api sends; nothing leaves the machine. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - '${FORGEFLOW_SMTP_PORT:-1025}:1025'
      - '${FORGEFLOW_MAILPIT_PORT:-8025}:8025'
    # The image ships a healthcheck (`/mailpit readyz`), so `up --wait` waits for it.

volumes:
  pgdata:
