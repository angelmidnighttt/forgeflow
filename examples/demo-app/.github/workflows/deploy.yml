# Test, build the image, then "deploy" to staging and production. The deploy jobs name an
# `environment:`, so GitHub records a Deployment for each: the ForgeFlow GitHub App shows them on
# the project's Deployment page, next to this workflow's runs (CI).
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: |
          version="${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: APP_VERSION=${{ steps.tag.outputs.version }}

  deploy-staging:
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      # Stands in for a real deploy (ssh + docker compose, kubectl…): the timing and the outcome
      # are what ForgeFlow records.
      - name: Deploy
        run: |
          echo "Deploying ${{ needs.image.outputs.image }} to staging"
          sleep 10

  deploy-production:
    needs: [image, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy
        run: |
          echo "Deploying ${{ needs.image.outputs.image }} to production"
          sleep 10
