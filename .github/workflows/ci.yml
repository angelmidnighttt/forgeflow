name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A new push to dev or to a pull request cancels its older run; runs on main queue instead, so
  # a deploy is never cut off halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, build, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: forgeflow
          POSTGRES_PASSWORD: forgeflow
          POSTGRES_DB: forgeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgeflow -d forgeflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # Integration tests send email through it and read it back over its HTTP API.
      # The image has its own healthcheck, which the runner waits for.
      mailpit:
        image: axllent/mailpit:v1.34
        ports:
          - 1025:1025
          - 8025:8025
    env:
      NODE_ENV: test
      # The api's role (row-level security applies) and the owner for migrations (ADR-0002).
      DATABASE_URL: postgres://forgeflow_app:forgeflow_app@localhost:5432/forgeflow
      MIGRATION_DATABASE_URL: postgres://forgeflow:forgeflow@localhost:5432/forgeflow
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - name: Create the api's database role
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f infra/compose/postgres/init/01-app-role.sql
      - name: Migrations apply cleanly and are idempotent
        run: npm run db:migrate && npm run db:migrate
      - run: npm test

  # Skipped on dev, to keep its runs short: pull requests and main still build both images.
  images:
    name: Docker images
    needs: check
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    env:
      # Pull requests only build; main also pushes ghcr.io/<owner>/forgeflow-<app>:<commit sha>.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/forgeflow-${{ matrix.app }}" >> "$GITHUB_ENV"
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Turned on by the repository variable STAGING_DEPLOY=true once the server is ready
  # (infra/staging/README.md).
  deploy-staging:
    name: Staging
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-staging.yml
    with:
      version: ${{ github.sha }}
    secrets: inherit
